name: kasirsapuangin
description: "Aplikasi kasir internal Sapuangin Coffee and Farm"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & database
  supabase_flutter: ^2.8.0

  # State management
  provider: ^6.1.2

  # Navigasi antar halaman
  go_router: ^14.6.1

  # Format Rupiah & tanggal (mis. Rp15.000, 3 Okt 2026)
  intl: ^0.19.0

  # Font kustom tanpa perlu taruh file font manual (ambil dari Google Fonts)
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true